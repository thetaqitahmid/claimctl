{{- include "claimctl.assertValues" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "claimctl.fullname" . }}-backend
  labels:
    app.kubernetes.io/name: {{ include "claimctl.name" . }}
    helm.sh/chart: {{ include "claimctl.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  {{- with .Values.backend.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.backend.revisionHistoryLimit }}
  revisionHistoryLimit: {{ . }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "claimctl.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      annotations:
        {{- if include "claimctl.isManagedDatabaseSecret" . }}
        checksum/db-secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.backend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        app.kubernetes.io/name: {{ include "claimctl.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: backend
        {{- with .Values.backend.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "claimctl.serviceAccountName" . }}
      automountServiceAccountToken: {{ and .Values.keyGeneration.enabled (not .Values.appEncryption.existingSecret) }}
      {{- with .Values.backend.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.backend.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- if .Values.backend.waitForDb.enabled }}
        - name: wait-for-db
          image: "{{ .Values.backend.waitForDb.image.repository }}:{{ .Values.backend.waitForDb.image.tag }}"
          imagePullPolicy: {{ .Values.backend.waitForDb.image.pullPolicy }}
          command: ['sh', '-c', 'until pg_isready -h ${DB_HOST} -p ${DB_PORT} -U ${DB_USER}; do echo waiting for database; sleep 2; done;']
          env:
            - name: DB_HOST
              value: {{ if .Values.postgres.enabled }}{{ include "claimctl.postgresHost" . | quote }}{{ else }}{{ .Values.db.host | quote }}{{ end }}
            - name: DB_PORT
              value: {{ .Values.db.port | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "claimctl.databaseSecretName" . }}
                  key: {{ include "claimctl.databaseUserKey" . }}
        {{- end }}
        {{- if and .Values.keyGeneration.enabled (not .Values.appEncryption.existingSecret) }}
        - name: generate-app-key
          image: "{{ .Values.keyGeneration.image.repository }}:{{ .Values.keyGeneration.image.tag }}"
          imagePullPolicy: {{ .Values.keyGeneration.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              SECRET_NAME={{ .Values.keyGeneration.secretName | default (printf "%s-secret" (include "claimctl.fullname" .)) }}
              KEY_NAME={{ .Values.keyGeneration.keyName }}

              get_key() {
                kubectl get secret "$SECRET_NAME" -n {{ .Release.Namespace }} -o jsonpath="{.data.$KEY_NAME}" 2>/dev/null
              }

              KEY=$(get_key)
              if [ -z "$KEY" ]; then
                echo "Generating new app encryption key..."
                NEW_KEY=$(head -c 32 /dev/urandom | base64)
                # `kubectl create` is atomic: if another replica created the secret
                # concurrently it fails with AlreadyExists, and we fall through to
                # read the winner's key so all replicas converge on a single key.
                if ! kubectl create secret generic "$SECRET_NAME" -n {{ .Release.Namespace }} --from-literal="$KEY_NAME=$NEW_KEY" 2>/dev/null; then
                  echo "Secret created concurrently; reading existing key"
                fi
                KEY=$(get_key)
                if [ -z "$KEY" ]; then
                  echo "Failed to create or read secret $SECRET_NAME" >&2
                  exit 1
                fi
              fi
              echo "App encryption key is ready"
        {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.backend.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          startupProbe:
            {{- toYaml .Values.backend.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.backend.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.backend.readinessProbe | nindent 12 }}
          env:
            - name: DB_HOST
              value: {{ if .Values.postgres.enabled }}{{ include "claimctl.postgresHost" . | quote }}{{ else }}{{ .Values.db.host | quote }}{{ end }}
            - name: DB_PORT
              value: {{ .Values.db.port | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "claimctl.databaseSecretName" . }}
                  key: {{ include "claimctl.databaseUserKey" . }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "claimctl.databaseSecretName" . }}
                  key: {{ include "claimctl.databasePasswordKey" . }}
            - name: DB_NAME
              {{- if and .Values.postgres.enabled .Values.postgres.userDatabase.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.userDatabase.existingSecret }}
                  key: {{ include "claimctl.databaseNameKey" . }}
              {{- else if .Values.postgres.enabled }}
              value: {{ .Values.postgres.userDatabase.name.value | quote }}
              {{- else if .Values.db.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.existingSecret }}
                  key: {{ include "claimctl.databaseNameKey" . }}
              {{- else }}
              value: {{ .Values.db.name | quote }}
              {{- end }}
            - name: SSL_MODE
              value: {{ .Values.backend.sslMode | quote }}
            {{- if .Values.backend.otel.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.backend.otel.endpoint | quote }}
            {{- end }}
            {{- if .Values.appEncryption.existingSecret }}
            - name: APP_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appEncryption.existingSecret }}
                  key: {{ .Values.appEncryption.secretKey | default "app-encryption-key" }}
            {{- else if .Values.keyGeneration.enabled }}
            - name: APP_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keyGeneration.secretName | default (printf "%s-secret" (include "claimctl.fullname" .)) }}
                  key: {{ .Values.keyGeneration.keyName }}
            {{- end }}
          {{- with .Values.backend.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
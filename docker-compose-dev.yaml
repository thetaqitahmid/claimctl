services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=
      - TRUSTED_PROXY_CIDRS=0.0.0.0/0,::/0
      - HEALTH_CHECK_ALLOWED_CIDRS=0.0.0.0/0,::/0
      - HEALTH_CHECK_ALLOWED_PORTS=*
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=devuser
      - DB_PASSWORD=devpass
      - DB_NAME=devdb
      - SSL_MODE=disable
      # - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      # - APP_ENCRYPTION_KEY= # Set this to a 32-byte base64 string for production
      - ENABLE_CSRF=false
      - COOKIE_SECURE=false
      - COOKIE_SAMESITE=Lax
      - CORS_ALLOWED_ORIGINS=http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  frontend:
    build: ./frontend
    ports:
      - "5173:8080"
    environment:
      - BACKEND_HOST=backend
      - BACKEND_PORT=3000
      - TRUSTED_INGRESS_CIDR=0.0.0.0/0
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 128M

  db:
    image: postgres:18.1-alpine
    entrypoint: ["/usr/local/bin/claimctl-postgres-preflight"]
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: devdb
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./deployment/postgres-preflight.sh:/usr/local/bin/claimctl-postgres-preflight:ro
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  postgres_data:

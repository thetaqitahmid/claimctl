name: Helm Chart Pipeline

on:
  push:
    branches: ["main"]
    paths:
      - "charts/**"
      - ".github/workflows/helm.yml"
  pull_request:
    paths:
      - "charts/**"
      - ".github/workflows/helm.yml"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "latest"

      - name: Build chart dependencies
        run: |
          helm repo add groundhog2k https://groundhog2k.github.io/helm-charts/
          helm dependency build charts/claimctl

      - name: Lint chart
        run: |
          echo "Linting the claimctl chart..."
          helm lint charts/claimctl -f charts/claimctl/ci/lint-values.yaml

      - name: Template chart
        run: |
          echo "Rendering templates with synthetic CI values..."
          helm template claimctl charts/claimctl \
            -f charts/claimctl/ci/lint-values.yaml > /dev/null

  publish:
    runs-on: ubuntu-latest
    needs: [lint]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "latest"

      - name: Build chart dependencies
        run: |
          helm repo add groundhog2k https://groundhog2k.github.io/helm-charts/
          helm dependency build charts/claimctl

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username ${{ github.actor }} --password-stdin

      - name: Package and push chart
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          BASE_VER=$(cat BASE_VERSION | tr -d '\n')
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)
          COMMIT=$(echo "${{ github.sha }}" | cut -c1-7)
          VERSION="${BASE_VER}-${TIMESTAMP}-${COMMIT}"

          echo "Packaging claimctl chart version ${VERSION}"
          helm package charts/claimctl --version "${VERSION}" --destination .helm-release

          echo "Pushing chart to oci://ghcr.io/${REPO}/helm"
          helm push ".helm-release/claimctl-${VERSION}.tgz" "oci://ghcr.io/${REPO}/helm"
